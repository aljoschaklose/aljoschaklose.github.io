<!DOCTYPE html>
<html>
  <head>
    <title>AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.2/aframe/build/aframe-ar.min.js"></script>
    <style>
      #slider-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.8);
        padding: 10px;
        border-radius: 10px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="slider-container">
      Höhe (m): <span id="height-value">0</span><br>
      <input type="range" id="height-slider" min="-2" max="2" step="0.1" value="0">
    </div>

<a href="intent://arvr.google.com/scene-viewer/1.0?file=https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF/Avocado.gltf&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;">Avocado</a>;

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; gpsMinAccuracy: 100; debugUIEnabled: true;"
    >
      <a-camera gps-camera rotation-reader></a-camera>

      <a-box 
        id="corpse" 
        gps-entity-place="latitude: 52.281659; longitude: 10.484097;"
        position="0 0 0" 
        scale="1 1 1"
        color="red">
      </a-box>
    </a-scene>

    <script>
      const slider = document.getElementById('height-slider');
      const heightValue = document.getElementById('height-value');
      const corpse = document.getElementById('corpse');

      slider.addEventListener('input', () => {
        const y = parseFloat(slider.value);
        heightValue.textContent = y.toFixed(1);
        corpse.setAttribute('position', `0 ${y} 0`);
      });
    </script>
  </body>
</html>
